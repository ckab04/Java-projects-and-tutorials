<!-- <tr class="hover:bg-gray-50 transition-colors"> -->
  <td class="px-6 py-3.5">
    <input type="checkbox" class="w-4 h-4 rounded accent-indigo-600" (click)="emitTaskCompletionEvent(task())" />
  </td>
  <td class="px-4 py-3.5">
    <p [innerHTML] = "task().title | highlight: searchTerm()" class="text-sm font-medium text-gray-800"></p>
    <p class="text-xs text-gray-400 mt-0.5">{{task().description}}</p>
  </td>
  <td class="px-4 py-3.5">
    <span class="text-xs text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">{{task().board}}</span>
  </td>
  <td class="px-4 py-3.5">
    <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-red-100 text-red-700">{{task().priority}}</span>
  </td>
  <td class="px-4 py-3.5">
    <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">{{task().status}}</span>
  </td>
  <td class="px-4 py-3.5">
    <div class="flex items-center gap-2">
      @let startingLetter = task().assignee[0].toUpperCase();
      <div class="w-6 h-6 rounded-full bg-purple-500 flex items-center justify-center text-xs text-white font-bold">{{startingLetter}}</div>
      <span class="text-sm text-gray-600">{{task().assignee}}</span>
    </div>
  </td>
  <td [appHighlightOverdue]= "task().dueDate" class="px-4 py-3.5 text-sm text-gray-500">{{task().dueDate}}</td>
  <td class="px-4 py-3.5">
    <div class="flex items-center gap-1">
      <button class="p-1 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded transition-colors">
        <span class="material-icons" style="font-size:16px">edit</span>
      </button>
      <button class="p-1 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors">
        <span class="material-icons" style="font-size:16px">delete</span>
      </button>
    </div>
  </td>
<!-- </tr> -->
