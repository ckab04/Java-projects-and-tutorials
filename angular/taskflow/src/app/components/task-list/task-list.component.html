<div class="space-y-5">

  <!-- Page Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">All Tasks</h1>
      <p class="text-sm text-gray-500 mt-1">48 tasks across all boards</p>
    </div>
    <button class="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition-colors">
      <span class="material-icons" style="font-size:18px">add</span>
      New Task
    </button>
  </div>

  <!-- Filters Bar -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4">
    <div class="flex items-center gap-3 flex-wrap">
      <!-- Search -->
      <div class="relative flex-1 min-w-48">
        <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" style="font-size:16px">search</span>
        <input
          type="text"
          [value] = "searchTerm()"
          (input) = "searchTerm.set($event.target.value)"
          placeholder="Search tasks..."
          class="pl-8 pr-4 py-2 w-full border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
        />
      </div>
      <!-- Priority filter -->
      <select
        [value] = "getFilter('priority')"
        (change)="setFilter('priority',$event)"
        class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <option value="">All Priorities</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <!-- Status filter -->
      <select
        [value] = "getFilter('status')"
        (change) = "setFilter('status',$event)"
        class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <option value="">All Statuses</option>
        <option value="todo">To Do</option>
        <option value="inprogress">In Progress</option>
        <option value="review">Review</option>
        <option value="done">Done</option>
      </select>
      <!-- Assignee filter -->
      <select
        [value] = "getFilter('assignee')"
        (change) = "setFilter('assignee',$event)"
        class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <option value="">All Assignees</option>
        <option value="Sara">Sara</option>
        <option value="Alex">Alex</option>
        <option value="Ryan">Ryan</option>
        <option value="Maya">Maya</option>
      </select>
      <!-- Board filter -->
      <select

        [value] = "getFilter('board')"
        (change) = "setFilter('board',$event)"
        class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <option value="">All Boards</option>
        <option value="Website redesign">Website Redesign</option>
        <option value="Mobile App">Mobile App</option>
        <option value="API Integration">API Integration</option>
      </select>
      <!-- Sort -->
      <button

        (click) = "sortDueDate()"
        class="flex items-center gap-1.5 px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition-colors ml-auto">
        <span class="material-icons" style="font-size:16px">sort</span>
        Sort: Due Date
      </button>
    </div>
  </div>

  <!-- Task Table -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
    <table class="w-full">
      <thead>
        <tr class="border-b border-gray-100 bg-gray-50">
          <th class="px-6 py-3 text-left">
            <input type="checkbox" class="w-4 h-4 rounded accent-indigo-600" />
          </th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Task</th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Board</th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Priority</th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Assignee</th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Due Date</th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-50">
        <!-- Row 1 -->
        @for(task  of filteredTasks(); track task.id ){
          <tr app-task-card [task] = "task"
            class="hover:bg-gray-50 transition-colors"
            [searchTerm] = "searchTerm()"
            (taskCompletion) = "completeTask($event)"
          ></tr>
